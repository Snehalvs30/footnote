name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the Python version in .python-version and the exact package
      # versions in uv.lock (--locked fails if the lock file is out of date).
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # The embedding model (~70 MB) is downloaded once, then reused across runs.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/footnote/fastembed
          key: fastembed-bge-small-en-v1.5

      # Unit tests plus integration tests. Testcontainers starts PostgreSQL with
      # pgvector using the Docker engine GitHub's Ubuntu runners already have.
      - name: Test
        run: uv run pytest -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type-checks with TypeScript, then builds the production bundle.
      - name: Build
        run: npm run build

  publish:
    name: Publish image
    # Only after both test jobs pass, and only for pushes to main (not pull requests).
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry with the built-in token
    steps:
      - uses: actions/checkout@v5

      # QEMU emulates ARM, so one runner can build images for Intel (amd64) and
      # ARM (arm64): Apple Silicon Macs, kind on them, and Graviton servers.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: "latest", and "sha-<commit>" so deployments can pin an exact build.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/snehalvs30/footnote   # registry names must be lowercase
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
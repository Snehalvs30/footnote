[project]
name = "footnote-backend"
version = "0.1.0"
description = "Footnote API: answers questions about your documents, with citations."
readme = "README.md"
authors = [
    { name = "Snehal Shinde", email = "shinde.sne@northeastern.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.1.0",
    "fastapi[standard]>=0.159.1",
    "fastembed>=0.9.0",
    "openai>=3.36.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.2",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
